<title>瞬影簿 · 轻量科普图卡</title>
<style>
  /* ===================== 主题变量 ===================== */
  :root{
    --bg:#f7f7f8;          /* 页面背景 */
    --card-bg:#ffffff;     /* 卡片背景 */
    --text:#222222;        /* 主文字 */
    --muted:#888888;       /* 次要文字 */
    --accent:#ff2e4d;      /* 强调色（小红书风格红） */
    --radius:12px;         /* 圆角 */
    --gap:14px;            /* 卡片间距 */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
  }

  /* ===================== 顶部栏 ===================== */
  header{
    position:sticky;top:0;z-index:10;            /* 吸顶，滚动时常驻 */
    background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(8px);     /* 轻量毛玻璃 */
    border-bottom:1px solid #eee;
    padding:12px 16px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  header h1{font-size:20px;font-weight:700;letter-spacing:1px;white-space:nowrap;}
  header h1 span{color:var(--accent);}
  /* 搜索框 */
  #search{
    flex:1;min-width:180px;
    border:1px solid #ddd;border-radius:999px;
    padding:9px 16px;font-size:14px;outline:none;
    transition:border-color .15s;
  }
  #search:focus{border-color:var(--accent);}

  /* ===================== 瀑布流布局 ===================== */
  /* 使用 CSS 多列实现瀑布流：纯 CSS、零 JS 计算、最轻量 */
  .masonry{
    column-count:4;column-gap:var(--gap);
    padding:var(--gap);max-width:1200px;margin:0 auto;
  }
  @media(max-width:900px){.masonry{column-count:3;}}  /* 平板 */
  @media(max-width:600px){.masonry{column-count:2;}}  /* 手机 */

  .card{
    break-inside:avoid;                 /* 关键：防止卡片被分栏截断 */
    background:var(--card-bg);
    border-radius:var(--radius);
    margin-bottom:var(--gap);
    overflow:hidden;
    box-shadow:0 1px 4px rgba(0,0,0,.06);
    cursor:pointer;
  }
  .card img{width:100%;height:auto;display:block;background:#eee;}  /* 保留原图比例，形成错落感 */
  .card .body{padding:10px 12px;}
  .card .title{font-size:14px;font-weight:600;}
  .card .desc{font-size:12px;color:var(--muted);margin-top:4px;}
  .card .tag{
    display:inline-block;font-size:11px;color:var(--accent);
    background:#fff0f2;border-radius:6px;padding:1px 8px;margin-top:8px;
  }
  .empty{text-align:center;color:var(--muted);padding:40px;column-span:all;}  /* 无结果提示 */

  /* ===================== 大图预览弹窗 ===================== */
  .modal{
    position:fixed;inset:0;z-index:100;
    background:rgba(0,0,0,.85);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:24px;
  }
  .modal[hidden]{display:none;}          /* 默认隐藏 */
  .modal img{max-width:92vw;max-height:80vh;border-radius:8px;}
  .modal .cap{color:#fff;margin-top:12px;font-size:14px;text-align:center;}
  .modal .close{
    position:absolute;top:16px;right:20px;
    color:#fff;font-size:30px;line-height:1;
    cursor:pointer;user-select:none;
  }
</style>

const masonry  = document.getElementById('masonry');
const search   = document.getElementById('search');
const modal    = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const modalCap = document.getElementById('modalCap');

/* 渲染卡片：keyword 为空显示全部，否则按 标题/标签 前端筛选 */
function render(keyword = ''){
  const kw = keyword.trim().toLowerCase();
  /* 先携带原始下标再过滤，确保搜索后点击卡片仍能取到正确的 DATA 记录 */
  const list = DATA
    .map((d, idx) => ({ d, idx }))
    .filter(x => !kw || x.d.title.toLowerCase().includes(kw) || x.d.tag.toLowerCase().includes(kw));
  masonry.innerHTML = list.length
    ? list.map(({d, idx}) => `
        <article class="card" data-idx="${idx}">
          <img src="${d.img}" alt="${d.title}" loading="lazy">
          <div class="body">
            <div class="title">${d.title}</div>
            <div class="desc">${d.desc}</div>
            <span class="tag">#${d.tag}</span>
          </div>
        </article>`).join('')
    : `<p class="empty">${kw ? '没有找到相关卡片 🙃' : '还没有卡片，在 DATA 里添加内容吧 📷'}</p>`;
}

/* 搜索：输入即时筛选 */
search.addEventListener('input', e => render(e.target.value));

/* 点击卡片 → 打开大图弹窗（事件委托，性能更好） */
masonry.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if(!card) return;
  const d = DATA[card.dataset.idx];
  modalImg.src = d.img;
  modalCap.textContent = d.title;
  modal.hidden = false;
});

/* 关闭弹窗：× 按钮 / 点击黑色背景 / 按 Esc */
document.getElementById('modalClose').addEventListener('click', () => modal.hidden = true);
modal.addEventListener('click', e => { if(e.target === modal) modal.hidden = true; });
document.addEventListener('keydown', e => { if(e.key === 'Escape') modal.hidden = true; });

/* =========================================================
   随机排序开关
   true  = 每次打开/刷新页面，卡片顺序都会重新打乱
   false = 按 DATA 里的原始顺序展示
   说明：打乱只在页面加载时执行一次，
        之后搜索筛选不会重新打乱，避免结果乱跳。
   ========================================================= */
const SHUFFLE = true;

if(SHUFFLE){
  /* Fisher-Yates 洗牌算法：原地随机打乱 DATA 顺序 */
  for(let i = DATA.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [DATA[i], DATA[j]] = [DATA[j], DATA[i]];
  }
}

/* 首次渲染 */
render();
</script>
